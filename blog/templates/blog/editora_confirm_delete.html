<!-- templates/blog/editora_confirm_delete.html -->
<h1>Tem certeza que deseja excluir esta editora?</h1>

<p><strong>{{ editora.nome }}</strong></p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar</button>
</form>

<a href="{% url 'blog:editora_list' %}">Voltar para a lista de editoras</a>
