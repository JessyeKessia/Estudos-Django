<!-- templates/blog/livro_form.html -->
<h1>{% if livro %}Editar{% else %}Novo{% endif %} Livro</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if livro %}Salvar Alterações{% else %}Criar Livro{% endif %}</button>
</form>

<a href="{% url 'blog:livro_list' %}">Voltar para a lista de livros</a>
