<!-- templates/blog/editora_form.html -->
<h1>{% if editora %}Editar{% else %}Nova{% endif %} Editora</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if editora %}Salvar Alterações{% else %}Criar Editora{% endif %}</button>
</form>

<a href="{% url 'blog:editora_list' %}">Voltar para a lista de editoras</a>
